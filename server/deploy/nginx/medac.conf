# Medac nginx — maps /medac/api/* -> 127.0.0.1:3100/api/* and health
# Assumes existing app remains on other routes; do not proxy medac paths to old app.
# Place in /etc/nginx/sites-available/medac.conf and symlink to sites-enabled.

upstream medac_api {
    server 127.0.0.1:3100;
}

# Redirect HTTP -> HTTPS (enable after cert issued)
# server {
#     listen 80;
#     server_name example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 443 ssl http2;
    server_name example.com;

    # ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    # Security headers (API)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    client_max_body_size 1m; # global small; larger for image upload location below

    # Preserve/generate request IDs
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;

    # Trust only local proxy for X-Forwarded-For (Fastify trustProxy=1)
    # Do not trust arbitrary client headers.

    # Existing app routes (must remain functional) — example passthrough
    # location / { proxy_pass http://127.0.0.1:3002; }

    # Medac API — public base is /medac/api/v1, internal is /api/v1
    location /medac/api/ {
        # Strip /medac prefix, keep /api/v1
        rewrite ^/medac(/.*)$ $1 break;
        proxy_pass http://medac_api;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_set_header Connection "";
        # CORS preflight handled by Fastify; add explicit allowlist via env
    }

    location = /medac/health {
        rewrite ^/medac/health$ /health/live break;
        proxy_pass http://medac_api;
    }

    location /medac/health/ {
        rewrite ^/medac/health/(.*)$ /health/$1 break;
        proxy_pass http://medac_api;
    }

    location /medac/version {
        rewrite ^/medac/version$ /version break;
        proxy_pass http://medac_api;
    }

    # Label image upload — slightly larger body limit (still well below 25MB legacy)
    location /medac/api/v1/patients/ {
        # This catches intelligence/label endpoints; allow up to 5MB
        client_max_body_size 5m;
        rewrite ^/medac(/.*)$ $1 break;
        proxy_pass http://medac_api;
    }
}
