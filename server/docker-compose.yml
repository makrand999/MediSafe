# Docker Compose for local PostgreSQL only (not production deployment)
# Per Phase 0: provides Postgres 16 for local dev/tests; app runs on host via `npm run dev`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: medac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medac
      POSTGRES_PASSWORD: medac
      POSTGRES_DB: medac
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medac -d medac"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
